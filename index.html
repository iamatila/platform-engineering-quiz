<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Engineering Quiz</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a6fe8'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui%2C-apple-system%2Csans-serif' font-size='13' font-weight='800' fill='%23ffffff' letter-spacing='-0.5'%3Epeq%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="home-hero">
      <!-- HERO BANNER -->
      <div class="hero-banner" aria-hidden="true">
        <svg class="hero-svg" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Platform Engineering Quiz Hub">

          <!-- Background gradient panel -->
          <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#0d1117"/>
              <stop offset="100%" stop-color="#161b22"/>
            </linearGradient>
            <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
              <stop offset="50%"  stop-color="#58a6ff" stop-opacity="1"/>
              <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%"   stop-color="#58a6ff"/>
              <stop offset="100%" stop-color="#bc8cff"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Background rect -->
          <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

          <!-- Decorative grid lines (subtle) -->
          <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
            <line x1="0" y1="55"  x2="900" y2="55"/>
            <line x1="0" y1="110" x2="900" y2="110"/>
            <line x1="0" y1="165" x2="900" y2="165"/>
            <line x1="225" y1="0" x2="225" y2="220"/>
            <line x1="450" y1="0" x2="450" y2="220"/>
            <line x1="675" y1="0" x2="675" y2="220"/>
          </g>

          <!-- Glow accent line across middle -->
          <line x1="0" y1="110" x2="900" y2="110" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6"/>

          <!-- Left: big icon cluster -->
          <!-- Gear / cog icon -->
          <g transform="translate(72,110)" filter="url(#glow)">
            <circle r="28" fill="none" stroke="#58a6ff" stroke-width="2.5" opacity="0.9"/>
            <circle r="14" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.9"/>
            <!-- gear teeth -->
            <g stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
              <line x1="0"  y1="-28" x2="0"  y2="-34"/>
              <line x1="0"  y1="28"  x2="0"  y2="34"/>
              <line x1="-28" y1="0" x2="-34" y2="0"/>
              <line x1="28"  y1="0" x2="34"  y2="0"/>
              <line x1="-20" y1="-20" x2="-24" y2="-24"/>
              <line x1="20"  y1="-20" x2="24"  y2="-24"/>
              <line x1="-20" y1="20"  x2="-24" y2="24"/>
              <line x1="20"  y1="20"  x2="24"  y2="24"/>
            </g>
            <!-- inner dot -->
            <circle r="5" fill="#58a6ff" opacity="0.9"/>
          </g>

          <!-- Small floating icons right side -->
          <!-- Docker whale-ish box -->
          <g transform="translate(810,60)" opacity="0.55">
            <rect x="-18" y="-12" width="36" height="24" rx="4" fill="none" stroke="#2496ed" stroke-width="2"/>
            <line x1="-6" y1="-12" x2="-6" y2="12" stroke="#2496ed" stroke-width="1.5"/>
            <line x1="6"  y1="-12" x2="6"  y2="12" stroke="#2496ed" stroke-width="1.5"/>
            <line x1="-18" y1="0" x2="18" y2="0" stroke="#2496ed" stroke-width="1.5"/>
          </g>

          <!-- K8s hexagon -->
          <g transform="translate(840,148)" opacity="0.55">
            <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#326ce5" stroke-width="2"/>
            <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="700" fill="#326ce5">K8s</text>
          </g>

          <!-- Terraform diamond -->
          <g transform="translate(790,155)" opacity="0.4">
            <polygon points="0,-16 14,0 0,16 -14,0" fill="none" stroke="#7b42bc" stroke-width="2"/>
          </g>

          <!-- Rocket -->
          <g transform="translate(822,108)" opacity="0.5">
            <ellipse cx="0" cy="0" rx="6" ry="12" fill="none" stroke="#3fb950" stroke-width="2" transform="rotate(-45)"/>
            <line x1="-4" y1="4" x2="-9" y2="9" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- Main title text -->
          <text x="160" y="95"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="42" font-weight="800" letter-spacing="-1"
            fill="url(#textGrad)" filter="url(#glow)">Platform Engineering</text>

          <text x="162" y="148"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="42" font-weight="800" letter-spacing="-1"
            fill="#e6edf3">Quiz Hub</text>

          <!-- Subtitle -->
          <text x="162" y="182"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" fill="#8b949e" letter-spacing="0.2">
            14 topics · 280 questions · 20 min timer · instant explanations
          </text>

          <!-- Stats pills -->
          <g transform="translate(162,198)">
            <rect width="80" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
            <text x="40" y="13" text-anchor="middle" font-size="10" font-weight="600" fill="#58a6ff">Beginner</text>

            <rect x="88" width="96" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
            <text x="136" y="13" text-anchor="middle" font-size="10" font-weight="600" fill="#3fb950">Intermediate</text>

            <rect x="192" width="64" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
            <text x="224" y="13" text-anchor="middle" font-size="10" font-weight="600" fill="#ff7b72">Expert</text>
          </g>

        </svg>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Beginner">Beginner</button>
      <button class="filter-btn" data-filter="Intermediate">Intermediate</button>
      <button class="filter-btn" data-filter="Expert">Expert</button>
    </div>

    <div class="topic-grid" id="topic-grid"></div>

    <footer class="home-footer">
      Based on the Platform Engineering Study Project · 14 Topics · 280 Questions
      <br/>
      <span class="footer-credit">
        Created by Oluwatobiloba Atilola &nbsp;·&nbsp;
        <a href="https://github.com/iamatila" target="_blank" rel="noopener">GitHub @iamatila</a>
      </span>
    </footer>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button class="btn-back" id="btn-back">← Back</button>
      <div class="quiz-title-wrap">
        <span class="quiz-topic-badge" id="quiz-topic-badge"></span>
        <h2 id="quiz-title"></h2>
      </div>
      <div class="quiz-header-right">
        <!-- TIMER -->
        <div class="timer-wrap" id="timer-wrap">
          <svg class="timer-ring" viewBox="0 0 44 44">
            <circle class="timer-ring-bg" cx="22" cy="22" r="18"/>
            <circle class="timer-ring-fill" id="timer-ring-fill" cx="22" cy="22" r="18"
              stroke-dasharray="113.1" stroke-dashoffset="0"/>
          </svg>
          <span class="timer-text" id="timer-text">20:00</span>
        </div>
        <!-- PROGRESS -->
        <div class="progress-wrap">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
          <span class="progress-text" id="progress-text">1 / 20</span>
        </div>
      </div>
    </div>

    <div class="question-card" id="question-card">
      <div class="q-number" id="q-number">Question 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="options-list" id="options-list"></div>
      <button class="btn-next" id="btn-next" disabled>Next →</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="screen">
    <div class="results-header">
      <button class="btn-back" id="btn-results-back">← Choose Another Topic</button>
      <h2>Quiz Complete!</h2>
      <div class="score-circle-wrap">
        <svg class="score-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52"
            stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        </svg>
        <div class="score-text-inner">
          <span class="score-num" id="score-num">0</span>
          <span class="score-den" id="score-den">/20</span>
        </div>
      </div>
      <div class="score-label" id="score-label"></div>
      <div class="time-taken-label" id="time-taken-label"></div>
    </div>

    <div class="results-body">
      <div class="results-tabs">
        <button class="tab-btn active" id="tab-wrong" onclick="showTab('wrong')">❌ Incorrect <span id="wrong-count"></span></button>
        <button class="tab-btn" id="tab-right" onclick="showTab('right')">✅ Correct <span id="right-count"></span></button>
      </div>
      <div id="results-list"></div>
    </div>

    <div class="results-actions">
      <button class="btn-retry" id="btn-retry">🔁 Retry This Topic</button>
      <button class="btn-home" id="btn-home">🏠 All Topics</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
